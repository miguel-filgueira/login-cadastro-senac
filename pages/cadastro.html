<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- REMIXICON -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/login.css" />

    <!-- Login JS -->
    <script src="../assets/js/mostrarSenha.js" defer></script>
    <script src="../assets/js/cadastro.js" defer></script>

    <title>Cadastro</title>
  </head>
  <body>
    <main class="login">
      <img
        src="../assets/image/imagem-cadastro.jpg"
        alt="imagem-cadastro"
        login__img
      />

      <form class="login__form">
        <h1 class="login__title">Cadastro</h1>

        <div class="login__content">
          <div class="login__box">
            <i class="ri-user-3-line login__icon"></i>

            <div class="login__box-input">
              <input
                type="email"
                id="cadastro-email"
                class="login__input"
                required
                placeholder=""
              />

              <label for="cadastro-email" class="login__label">E-mail</label>
            </div>
          </div>

          <div class="login__box">
            <i class="ri-lock-line login__icon"></i>

            <div class="login__box-input">
              <input
                type="password"
                id="login-pass"
                class="login__input"
                required
                placeholder=""
              />

              <label for="cadastro-pass" class="login__label">Password</label>
            </div>

            <i class="ri-eye-off-line login__eye" id="login-eye"></i>
          </div>

          <div class="login__box">
            <i class="ri-lock-line login__icon"></i>

            <div class="login__box-input">
              <input
                type="password"
                id="cadastro-pass-confirm"
                class="login__input"
                required
                placeholder=""
              />

              <label for="cadastro-pass-confirm" class="login__label"
                >Report Password</label
              >
            </div>

            <i class="ri-eye-off-line login__eye" id="login-eye-confirm"></i>
          </div>

          <button type="submit" class="login__button">Register</button>

          <p class="login__register">
            have an account?
            <a href="../index.html">Login</a>
          </p>
        </div>
      </form>
    </main>
  </body>
</html>
